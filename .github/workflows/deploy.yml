name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build
        run: bun run build

      - name: Prepare and verify GitHub Pages output
        run: |
          test -f dist/index.html
          test -f dist/favicon.svg
          ! grep -q 'src/index\.ts' dist/index.html
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Prevent legacy branch deploy from overwriting dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Attempt to switch Pages source from legacy branch to GitHub Actions workflow (non-fatal if restricted)
          curl -fsSL -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}' >/dev/null 2>&1 || true

          # If GitHub's legacy "pages build and deployment" is also running for this commit,
          # wait for it to finish so actions/deploy-pages@v4 always publishes the compiled dist/ LAST.
          WAITED=0
          for i in $(seq 1 24); do
            ACTIVE=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=20" \
              | jq -r '[.workflow_runs[]? | select(.name == "pages build and deployment" and (.status == "queued" or .status == "in_progress" or .status == "waiting"))] | length' 2>/dev/null || echo "0")
            if [ "${ACTIVE:-0}" = "0" ]; then
              break
            fi
            WAITED=1
            echo "Waiting for legacy pages build and deployment to complete ($i/24)..."
            sleep 5
          done
          if [ "$WAITED" = "1" ]; then
            sleep 3
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
